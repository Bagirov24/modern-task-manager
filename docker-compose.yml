services:
  migrate:
    build: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/taskmanager
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/taskmanager
      TEST_DATABASE_URL: postgresql://postgres:password@db:5432/taskmanager_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ENVIRONMENT: development
      DEBUG: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      target: builder
    ports:
      - "5173:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "psql -h db -U postgres -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='taskmanager_test'\" | grep -q 1 || createdb -h db -U postgres taskmanager_test"
    restart: "no"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery:
    build: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/taskmanager
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ENVIRONMENT: development
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
