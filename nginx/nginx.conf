# =============================================================================
# Nginx reverse-proxy configuration for Modern Task Manager
# =============================================================================
# TLS certificates are expected at:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# Mount them as a read-only volume in docker-compose.prod.yml.
# For local dev (no certs) use docker-compose.yml which exposes port 80 only.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ------------------------------------------------------------------
    # Upstream definitions
    # ------------------------------------------------------------------
    upstream api {
        server api:8000;
        keepalive 32;
    }

    upstream web {
        server web:3000;
        keepalive 16;
    }

    # ------------------------------------------------------------------
    # Rate-limit zones  (shared memory, survives worker restarts)
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m   rate=10r/s;

    # ------------------------------------------------------------------
    # Global security defaults applied to every response
    # ------------------------------------------------------------------
    # Strip upstream server header to avoid version disclosure.
    proxy_hide_header Server;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css
               application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ------------------------------------------------------------------
    # HTTP → HTTPS redirect  (port 80)
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge through before redirect.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS server  (port 443)
    # ------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        # ── TLS ─────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                            ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
                            ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:
                            DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # ── Security headers ─────────────────────────────────────────
        # HSTS — tell browsers to always use HTTPS for 1 year.
        add_header Strict-Transport-Security
            "max-age=31536000; includeSubDomains; preload" always;

        # CSP — restrict resource origins; adjust connect-src for your
        # actual API/WS domain in production.
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data: https:; "
            "connect-src 'self' wss:; "
            "font-src 'self'; "
            "object-src 'none'; "
            "frame-ancestors 'none'" always;

        add_header X-Frame-Options          "DENY" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ── Proxy timeouts ───────────────────────────────────────────
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ── API proxy ────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Auth endpoints — tighter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket ────────────────────────────────────────────────
        location /ws {
            limit_req zone=ws_limit burst=5 nodelay;
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400;
        }

        # ── Health probes ────────────────────────────────────────────
        # Public liveness — exposed to load balancer / uptime monitors.
        location = /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # Internal probes — only reachable from localhost / Docker network.
        # The API itself also guards these with X-Internal-Token, but
        # blocking at the proxy layer provides defence-in-depth.
        location ~ ^/health/(db|redis|ready)$ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker bridge networks
            allow 10.0.0.0/8;      # Internal VPC / compose network
            deny  all;
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # ── Frontend ─────────────────────────────────────────────────
        location / {
            proxy_pass http://web;
            proxy_set_header Host        $host;
            proxy_set_header X-Real-IP   $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
